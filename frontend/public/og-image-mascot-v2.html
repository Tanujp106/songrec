<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/switzer" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        align-items: center;
        background: #5A54F2;
        color: white;
        display: flex;
        font-family: "Switzer", "Inter", sans-serif;
      }
      .card {
        align-items: center;
        display: grid;
        grid-template-columns: 44% 56%;
        height: 100%;
        padding: 54px 72px;
        width: 100%;
      }
      .mascot-wrap { align-items: center; display: flex; justify-content: center; }
      .mascot {
        align-items: center;
        background: #EBE9FF;
        border: 10px solid #fff;
        border-radius: 50%;
        box-shadow: 0 18px 36px rgba(42, 42, 42, 0.25);
        display: flex;
        height: 362px;
        justify-content: center;
        overflow: hidden;
        width: 362px;
      }
      .copy { padding-left: 26px; }
      .brand {
        font-family: "Spectral", serif;
        font-size: 32px;
        letter-spacing: 0.04em;
        margin: 0 0 16px;
        opacity: 0.9;
      }
      h1 {
        font-family: "Spectral", serif;
        font-size: 88px;
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.92;
        margin: 0;
        max-width: 530px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mascot-wrap" aria-label="Songrec mascot">
        <div class="mascot">
          <svg aria-hidden="true" height="100%" viewBox="0 0 200 200" width="100%">
            <path id="left-eye" d="M 60 82 Q 75 74 90 82" fill="none" stroke="#2A2A2A" stroke-linecap="round" stroke-width="9" />
            <path id="right-eye" d="M 110 82 Q 125 74 140 82" fill="none" stroke="#2A2A2A" stroke-linecap="round" stroke-width="9" />
            <path id="mouth" d="M 80 125 Q 100 135 120 125" fill="none" stroke="#2A2A2A" stroke-linecap="round" stroke-width="9" />
          </svg>
        </div>
      </div>
      <div class="copy">
        <p class="brand">songrec</p>
        <h1>music for<br />your mood</h1>
      </div>
    </main>
    <script>
      const expressions = {
        party: ["M 60 75 Q 75 55 90 75", "M 110 75 Q 125 55 140 75", "M 65 110 Q 100 160 135 110"],
        "feel-good": ["M 60 85 Q 75 70 90 85", "M 110 85 Q 125 70 140 85", "M 70 115 Q 100 145 130 115"],
        soft: ["M 60 85 Q 75 90 90 85", "M 110 85 Q 125 90 140 85", "M 85 125 Q 100 130 115 125"],
        indie: ["M 60 82 Q 75 78 90 86", "M 110 86 Q 125 78 140 82", "M 75 128 Q 100 133 125 126"],
        retro: ["M 60 82 Q 75 70 90 78", "M 110 78 Q 125 70 140 82", "M 78 128 Q 100 136 122 130"],
        sad: ["M 60 90 Q 75 75 90 90", "M 110 90 Q 125 75 140 90", "M 70 135 Q 100 115 130 135"],
        love: ["M 60 80 Q 75 55 90 80", "M 110 80 Q 125 55 140 80", "M 85 125 Q 100 140 115 125"],
        hiphop: ["M 60 75 Q 75 85 90 90", "M 110 90 Q 125 85 140 75", "M 70 130 Q 100 140 130 125"],
      };
      const expression = expressions[new URLSearchParams(location.search).get("mood")] ?? [
        "M 60 82 Q 75 74 90 82", "M 110 82 Q 125 74 140 82", "M 80 125 Q 100 135 120 125",
      ];
      ["left-eye", "right-eye", "mouth"].forEach((id, index) => document.getElementById(id).setAttribute("d", expression[index]));
    </script>
  </body>
</html>
